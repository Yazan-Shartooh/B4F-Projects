<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <h1>Task Flow</h1>
      <p>All your tasks in one place.</p>
    </header>
    <main class="container">
      <section class="stats">
        <div class="stat-card">
          <p class="stat-label">Total Tasks</p>
          <p class="stat-value" id="totalCount">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Completed</p>
          <p class="stat-value" id="completedCount">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Pending</p>
          <p class="stat-value" id="pendingCount">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Completion Rate</p>
          <p class="stat-value" id="completedRate">0</p>
        </div>
      </section>
      <div class="btn-group">
        <button class="btn active" id="allTasks">All</button>
        <button class="btn" id="completedTasks">Completed</button>
        <button class="btn" id="pendingTasks">Pending</button>
      </div>
      <ul class="task-list" id="taskList"></ul>
    </main>
    <footer class="footer">
      <p>TaskFlow - built during the frontend training.</p>
    </footer>
    <script src="js/app.js"></script>
  </body>
</html>
