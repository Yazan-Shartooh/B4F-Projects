<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 3 Day 3: Assignment 6</title>
    <link rel="stylesheet" href="style/style2.css" />
  </head>
  <body>
    <form>
      <!--the slide container-->
      <div class="conteainer">
        <!--fisrt step-->
        <div class="slide-panel">
          <h2>Personal Info</h2>
          <div class="input-group">
            <label>Full Name</label>
            <input
              type="text"
              required
              placeholder="e.g. Will Smith"
              class="input"
            />
            <br />
            <label>Gender</label>
            <select class="input">
              <option value="m">Male</option>
              <option value="f">Female</option>
              <option value="p">Prefer not to say</option>
            </select>
            <br />
            <label>Birth Date</label>
            <input
              type="date"
              required
              placeholder="MM/DD/YYYY"
              class="input"
            />
            <br />
            <label>Phone Number</label>
            <input
              type="number"
              required
              placeholder="09########"
              class="input"
            />
            <br />
          </div>
        </div>

        <!--Second step-->
        <div class="slide-panel">
          <h2>Account Details</h2>
          <div class="input-group">
            <label>Email</label>
            <input
              type="email"
              required
              placeholder="you@example.com"
              class="input"
            />
            <br />
            <label>User Name</label>
            <input type="text" required placeholder="Your_Name" class="input" />
            <br />
            <label>Password</label>
            <input type="password" required class="input" /> <br />
          </div>
        </div>

        <!--third step-->
        <div class="slide-panel">
          <h2>Preferences</h2>
          <div class="input-group">
            <label>Choose Plan</label>
            <select class="input">
              <option value="free">Free</option>
              <option value="plus">Plus</option>
              <option value="premium">Premium</option>
            </select>
            <br />
            <label>Mode</label>
            <select class="input">
              <option value="light" id="light">Light</option>
              <option value="dark" id="dark">Dark</option>
            </select>
            <br />
          </div>
        </div>
        <div class="btn-group">
          <button type="reset">Clear</button>
          <button>Submit</button>
        </div>
      </div>
    </form>
  </body>
</html>
